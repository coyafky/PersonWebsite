<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Coya Personal Knowledge Field Architecture</title>
  <desc id="desc">A field architecture diagram connecting Obsidian, Hermes Lucas profile, CLI, Codex, the PersonalWebsite repository, Feishu, and Vercel publishing into a traceable growth loop.</desc>
  <defs>
    <linearGradient id="page" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f6f2e8" />
      <stop offset="48%" stop-color="#eef5f0" />
      <stop offset="100%" stop-color="#f3f0f7" />
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#263238" />
      <stop offset="100%" stop-color="#44515a" />
    </linearGradient>
    <linearGradient id="obsidian" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#7056b8" />
      <stop offset="100%" stop-color="#9a6fd5" />
    </linearGradient>
    <linearGradient id="hermes" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0c7c74" />
      <stop offset="100%" stop-color="#43a991" />
    </linearGradient>
    <linearGradient id="codex" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a5caa" />
      <stop offset="100%" stop-color="#4e8fd8" />
    </linearGradient>
    <linearGradient id="repo" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8d4f2f" />
      <stop offset="100%" stop-color="#c37548" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1b2529" flood-opacity="0.15" />
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#1b2529" flood-opacity="0.12" />
    </filter>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#344148" />
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#168377" />
    </marker>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#346fb7" />
    </marker>
    <style>
      .bg-line { stroke: rgba(43, 55, 60, 0.08); stroke-width: 1; }
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #243036; letter-spacing: 0; }
      .subtitle { font: 400 19px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526068; letter-spacing: 0; }
      .label { font: 700 23px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: 0; }
      .small-white { font: 500 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(255,255,255,0.86); letter-spacing: 0; }
      .body { font: 500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344148; letter-spacing: 0; }
      .body-strong { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #263238; letter-spacing: 0; }
      .tiny { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #627078; letter-spacing: 0; }
      .chip { font: 700 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #344148; letter-spacing: 0; }
      .node { rx: 18; filter: url(#shadow); }
      .panel { fill: rgba(255,255,255,0.72); stroke: rgba(38,50,56,0.12); stroke-width: 1.5; rx: 18; filter: url(#softShadow); }
      .mini { fill: rgba(255,255,255,0.82); stroke: rgba(38,50,56,0.12); stroke-width: 1.2; rx: 14; }
      .flow { fill: none; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; }
      .flow-soft { fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 8; }
      .halo { fill: none; stroke: rgba(38,50,56,0.11); stroke-width: 18; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1440" height="960" fill="url(#page)" />
  <g opacity="0.7">
    <path class="bg-line" d="M100 180H1340" />
    <path class="bg-line" d="M100 360H1340" />
    <path class="bg-line" d="M100 540H1340" />
    <path class="bg-line" d="M100 720H1340" />
    <path class="bg-line" d="M240 100V860" />
    <path class="bg-line" d="M480 100V860" />
    <path class="bg-line" d="M720 100V860" />
    <path class="bg-line" d="M960 100V860" />
    <path class="bg-line" d="M1200 100V860" />
  </g>

  <text class="title" x="96" y="88">个人知识场域架构</text>
  <text class="subtitle" x="96" y="124">Obsidian 捕获，Hermes 同步，Codex/CLI 加工，博客项目发布，让知识、项目和简历成长有迹可循。</text>

  <g>
    <rect class="node" x="543" y="268" width="354" height="178" fill="url(#core)" />
    <text class="label" x="720" y="318" text-anchor="middle">Coya Knowledge Field</text>
    <text class="small-white" x="720" y="350" text-anchor="middle">想法、经验、项目证据、职业叙事的加工场</text>
    <g transform="translate(588 378)">
      <rect width="112" height="34" rx="17" fill="rgba(255,255,255,0.15)" />
      <text class="small-white" x="56" y="23" text-anchor="middle">可回溯</text>
    </g>
    <g transform="translate(716 378)">
      <rect width="112" height="34" rx="17" fill="rgba(255,255,255,0.15)" />
      <text class="small-white" x="56" y="23" text-anchor="middle">可内化</text>
    </g>
    <g transform="translate(650 416)">
      <rect width="140" height="34" rx="17" fill="rgba(255,255,255,0.15)" />
      <text class="small-white" x="70" y="23" text-anchor="middle">可发布/复用</text>
    </g>
  </g>

  <path class="halo" d="M379 480 C368 282 526 151 727 151 C930 151 1090 283 1076 481 C1063 675 919 808 720 808 C520 808 391 674 379 480" />
  <path class="flow-soft" d="M379 480 C368 282 526 151 727 151 C930 151 1090 283 1076 481 C1063 675 919 808 720 808 C520 808 391 674 379 480" stroke="#68777f" marker-end="url(#arrowDark)" />

  <g>
    <rect class="node" x="92" y="204" width="330" height="184" fill="url(#obsidian)" />
    <text class="label" x="126" y="254">Obsidian</text>
    <text class="small-white" x="126" y="284">Coyapersonal Vault / 第一存储层</text>
    <text class="small-white" x="126" y="320">• 灵感、阅读、对话、碎片想法</text>
    <text class="small-white" x="126" y="348">• 原始笔记先保真，不急着公开</text>
  </g>

  <g>
    <rect class="node" x="1000" y="198" width="348" height="196" fill="url(#hermes)" />
    <text class="label" x="1034" y="248">Hermes / Lucas</text>
    <text class="small-white" x="1034" y="278">个人 Profile + 飞书连接</text>
    <text class="small-white" x="1034" y="314">• 同步日程、任务、复盘、通知</text>
    <text class="small-white" x="1034" y="342">• 将飞书知识转为可整理材料</text>
    <text class="small-white" x="1034" y="370">• 协调草稿、周报、简历证据</text>
  </g>

  <g>
    <rect class="node" x="92" y="550" width="342" height="184" fill="url(#codex)" />
    <text class="label" x="126" y="600">Codex + CLI</text>
    <text class="small-white" x="126" y="630">沟通、加工、转换、代码维护</text>
    <text class="small-white" x="126" y="666">• 把想法变成 blog / project / career 草稿</text>
    <text class="small-white" x="126" y="694">• 运行脚本、类型检查、内容迁移</text>
  </g>

  <g>
    <rect class="node" x="1000" y="548" width="348" height="190" fill="url(#repo)" />
    <text class="label" x="1034" y="598">PersonalWebsite</text>
    <text class="small-white" x="1034" y="628">博客项目 / 发布与证据仓库</text>
    <text class="small-white" x="1034" y="664">• content 作为长期内容账本</text>
    <text class="small-white" x="1034" y="692">• Vercel 部署公开页面</text>
  </g>

  <g>
    <rect class="panel" x="510" y="538" width="420" height="240" />
    <text class="body-strong" x="542" y="584">四类关键文件区</text>
    <text class="tiny" x="542" y="610">从原始材料到公开资产的分层沉淀</text>

    <g transform="translate(542 635)">
      <rect class="mini" width="168" height="54" />
      <text class="chip" x="18" y="24">Coyapersonal/</text>
      <text class="tiny" x="18" y="42">原始笔记库</text>
    </g>
    <g transform="translate(730 635)">
      <rect class="mini" width="168" height="54" />
      <text class="chip" x="18" y="24">content/inbox/</text>
      <text class="tiny" x="18" y="42">待处理入口</text>
    </g>
    <g transform="translate(542 708)">
      <rect class="mini" width="168" height="54" />
      <text class="chip" x="18" y="24">blog · weekly</text>
      <text class="tiny" x="18" y="42">文章与复盘</text>
    </g>
    <g transform="translate(730 708)">
      <rect class="mini" width="168" height="54" />
      <text class="chip" x="18" y="24">projects · career</text>
      <text class="tiny" x="18" y="42">作品与履历证据</text>
    </g>
  </g>

  <g>
    <rect class="panel" x="508" y="150" width="424" height="84" />
    <text class="body-strong" x="542" y="184">成长闭环</text>
    <text class="body" x="542" y="212">采集 → 对话 → 整理 → 内化 → 发布 → 回顾 → 再采集</text>
  </g>

  <g>
    <rect class="panel" x="1042" y="790" width="260" height="76" />
    <text class="body-strong" x="1070" y="822">Vercel / Public Site</text>
    <text class="tiny" x="1070" y="848">成熟内容进入公开表达层</text>
  </g>

  <g>
    <rect class="panel" x="136" y="790" width="260" height="76" />
    <text class="body-strong" x="164" y="822">飞书 / Lark</text>
    <text class="tiny" x="164" y="848">任务、复盘、协作上下文</text>
  </g>

  <g>
    <path class="flow" d="M422 296 C470 302 500 326 542 350" stroke="#7056b8" marker-end="url(#arrowDark)" />
    <text class="tiny" x="448" y="284">捕获进入场域</text>

    <path class="flow" d="M897 350 C940 324 968 308 1000 300" stroke="#168377" marker-end="url(#arrowGreen)" />
    <text class="tiny" x="916" y="284">同步上下文</text>

    <path class="flow" d="M434 634 C474 594 502 565 543 535" stroke="#346fb7" marker-end="url(#arrowBlue)" />
    <text class="tiny" x="442" y="616">加工/转换</text>

    <path class="flow" d="M897 650 C940 648 970 646 1000 644" stroke="#8d4f2f" marker-end="url(#arrowDark)" />
    <text class="tiny" x="914" y="630">写入仓库</text>

    <path class="flow" d="M1174 738 L1174 790" stroke="#8d4f2f" marker-end="url(#arrowDark)" />
    <text class="tiny" x="1192" y="770">部署</text>

    <path class="flow" d="M1000 374 C770 492 510 604 396 790" stroke="#168377" opacity="0.72" marker-end="url(#arrowGreen)" />
    <text class="tiny" x="557" y="690">Hermes 将飞书复盘带回个人系统</text>

    <path class="flow-soft" d="M396 826 C546 886 878 887 1042 828" stroke="#68777f" marker-end="url(#arrowDark)" />
    <text class="tiny" x="614" y="884">公开作品、项目记录、简历素材形成长期轨迹</text>
  </g>

  <g>
    <rect x="92" y="424" width="330" height="74" rx="16" fill="rgba(255,255,255,0.64)" stroke="rgba(38,50,56,0.12)" />
    <text class="body-strong" x="124" y="454">输入原则</text>
    <text class="tiny" x="124" y="478">先记录现场，再用 agent 归档、改写、提炼。</text>
  </g>

  <g>
    <rect x="1000" y="424" width="348" height="74" rx="16" fill="rgba(255,255,255,0.64)" stroke="rgba(38,50,56,0.12)" />
    <text class="body-strong" x="1032" y="454">输出原则</text>
    <text class="tiny" x="1032" y="478">只有成熟、可内化、可承担的内容进入公开发布。</text>
  </g>

  <g opacity="0.92">
    <circle cx="502" cy="352" r="8" fill="#7056b8" />
    <circle cx="942" cy="322" r="8" fill="#168377" />
    <circle cx="498" cy="568" r="8" fill="#346fb7" />
    <circle cx="945" cy="648" r="8" fill="#8d4f2f" />
  </g>
</svg>
