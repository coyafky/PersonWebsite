<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测试本地 API</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #faf9f6;
    color: #2d2a26;
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 24px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 8px; }
  .subtitle { color: #8c8680; font-size: 0.9rem; margin-bottom: 32px; }

  section {
    background: #fff;
    border: 1px solid #e8e4df;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  section h2 { font-size: 1rem; margin-bottom: 12px; }

  button {
    font-family: inherit; font-size: 0.9rem;
    padding: 8px 16px; border: none; border-radius: 8px;
    background: #c77d4b; color: #fff; cursor: pointer; font-weight: 600;
    margin-right: 8px; margin-bottom: 8px;
  }
  button:hover { background: #b06a3a; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  pre {
    background: #f5f2ed; border-radius: 8px; padding: 12px 16px;
    font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap;
    margin-top: 12px; max-height: 300px; overflow-y: auto;
  }
  pre.error { color: #c44; }
  pre.loading { color: #8c8680; }

  label { font-size: 0.85rem; color: #8c8680; display: block; margin-bottom: 4px; }
  input, textarea {
    font-family: inherit; font-size: 0.9rem; width: 100%;
    padding: 8px 12px; border: 1px solid #e8e4df; border-radius: 8px;
    margin-bottom: 8px; outline: none;
  }
  input:focus, textarea:focus { border-color: #c77d4b; }
  textarea { resize: vertical; min-height: 60px; }

  .status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
  .status-ok { background: #d4edda; color: #155724; }
  .status-err { background: #f8d7da; color: #721c24; }
</style>
</head>
<body>

<h1>测试本地 API</h1>
<p class="subtitle">确保 server.js 已启动: <code>node server.js</code></p>

<!-- GET 列表 -->
<section>
  <h2>GET /api/articles — 获取文章列表</h2>
  <button onclick="getArticles()">发送请求</button>
  <span class="status" id="list-status" style="display:none;"></span>
  <pre id="list-output" class="loading">点击按钮发送请求...</pre>
</section>

<!-- GET 单篇 -->
<section>
  <h2>GET /api/articles/:id — 获取单篇文章</h2>
  <label for="article-id">文章 ID</label>
  <input id="article-id" type="number" value="1" min="1" style="width:80px;" />
  <button onclick="getArticle()">发送请求</button>
  <span class="status" id="get-status" style="display:none;"></span>
  <pre id="get-output" class="loading">点击按钮发送请求...</pre>
</section>

<!-- POST 创建 -->
<section>
  <h2>POST /api/articles — 创建新文章</h2>
  <label for="new-title">标题</label>
  <input id="new-title" value="测试文章" />
  <label for="new-content">内容</label>
  <textarea id="new-content">通过 test.html 创建的内容</textarea>
  <button onclick="createArticle()">发送请求</button>
  <span class="status" id="post-status" style="display:none;"></span>
  <pre id="post-output" class="loading">点击按钮发送请求...</pre>
</section>

<script>
  const BASE = 'http://localhost:3001'

  function setStatus(el, ok) {
    el.style.display = 'inline-block'
    el.className = ok ? 'status status-ok' : 'status status-err'
    el.textContent = ok ? '✓ OK' : '✕ Error'
  }

  // ── GET /api/articles ────────────────
  async function getArticles() {
    const out = document.getElementById('list-output')
    const st = document.getElementById('list-status')
    out.textContent = '加载中...'
    out.className = 'loading'
    st.style.display = 'none'

    try {
      const res = await fetch(`${BASE}/api/articles`)
      const data = await res.json()
      out.className = ''
      out.textContent = JSON.stringify(data, null, 2)
      setStatus(st, true)
    } catch (err) {
      out.className = 'error'
      out.textContent = `请求失败: ${err.message}\n\n请确认 server.js 已启动: node server.js`
      setStatus(st, false)
    }
  }

  // ── GET /api/articles/:id ─────────────
  async function getArticle() {
    const id = document.getElementById('article-id').value
    const out = document.getElementById('get-output')
    const st = document.getElementById('get-status')
    out.textContent = '加载中...'
    out.className = 'loading'
    st.style.display = 'none'

    try {
      const res = await fetch(`${BASE}/api/articles/${id}`)
      const data = await res.json()
      out.className = res.ok ? '' : 'error'
      out.textContent = `${res.status} ${res.statusText}\n\n${JSON.stringify(data, null, 2)}`
      setStatus(st, res.ok)
    } catch (err) {
      out.className = 'error'
      out.textContent = `请求失败: ${err.message}`
      setStatus(st, false)
    }
  }

  // ── POST /api/articles ────────────────
  async function createArticle() {
    const title = document.getElementById('new-title').value
    const content = document.getElementById('new-content').value
    const out = document.getElementById('post-output')
    const st = document.getElementById('post-status')
    out.textContent = '发送中...'
    out.className = 'loading'
    st.style.display = 'none'

    try {
      const res = await fetch(`${BASE}/api/articles`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      })
      const data = await res.json()
      out.className = res.ok ? '' : 'error'
      out.textContent = `${res.status} ${res.statusText}\n\n${JSON.stringify(data, null, 2)}`
      setStatus(st, res.ok)
      if (res.ok) document.getElementById('new-title').value = ''
      if (res.ok) document.getElementById('new-content').value = ''
    } catch (err) {
      out.className = 'error'
      out.textContent = `请求失败: ${err.message}`
      setStatus(st, false)
    }
  }
</script>

</body>
</html>
